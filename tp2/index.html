<!DOCTYPE html>
<html>


<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <title>TP2</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Liaison avec la feuille de style CSS -->
  <link rel="stylesheet" href="style.css" />
  <!-- Titre et informations de la page -->
</head>

<body>

  <!-- Lien pour revenir à la page principale -->
  <nav>
    <a href="..">🏠 Index</a> / TP2
  </nav>

  <!-- Titre principal du TP -->
  <h1>TP #2</h1>

  <!-- Logo de l'Institut Galilée -->
  <img src="../galilee.png" alt="Logo Galilée" />

  <!-- Début du formulaire -->
  <form action="action.html" method="get">


    <!-- Champ Nom -->
    <p>
      <label for="name">Nom</label>
      <input type="text" id="name" name="name" minlength="2" maxlength="20" required />
      <span class="icon-ok">✓</span>
    </p>


    <!-- Champ Prénom -->
    <p>
      <label for="firstname">Prénom</label>
      <input type="text" id="firstname" name="firstname" minlength="2" maxlength="20" required />
      <span class="icon-ok">✓</span>
    </p>

    <!-- Champ Date de naissance -->
    <p>
      <label for="birthday">Date de naissance</label>
      <input type="date" id="birthday" name="birthday" required />
      <span class="icon-ok">✓</span>
    </p>

    <!-- Champ Adresse -->
    <p>
      <label for="address">Adresse</label>
      <input type="text" id="address" name="address" minlength="5" maxlength="50" required />
      <span class="icon-ok">✓</span>
    </p>

    <!-- Champ Email -->
    <p>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" minlength="5" maxlength="30" required />
      <span class="icon-ok">✓</span>
    </p>
    <!-- Bouton pour envoyer le formulaire -->
    <p>
      <input type="submit" value="Envoyer" class="btn-primary" />
    </p>
  </form>
  <!-- Fin du formulaire -->

</body>

</html>
